<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Product preview card component</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <div class="card-product">
        <picture class="card-product__media">
          <source
            media="(max-width: 600px)"
            srcset="./images/image-product-mobile.jpg"
          />

          <img
            class="card-product__image"
            src="./images/image-product-desktop.jpg"
            alt="Gabrielle Essence Eau De Parfum perfume bottle"
          />
        </picture>

        <div class="card-product__content">
          <div class="card-product__content-inner">
            <p class="card-product__category">Perfume</p>

            <h1 class="card-product__title">Gabrielle Essence Eau De Parfum</h1>

            <p class="card-product__description">
              A floral, solar and voluptuous interpretation composed by Olivier
              Polge, Perfumer-Creator for the House of CHANEL.
            </p>
          </div>
          <div class="card-product__price">
            <span class="card-product__price-discount">$149.99</span>
            <span class="card-product__price-original">$169.99</span>
          </div>

          <button class="card-product__button" type="button">
            <img src="./images/icon-cart.svg" alt="Cart icon" />
            Add to Cart
          </button>
        </div>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
        rel="noopener noreferrer"
      >
        Frontend Mentor </a
      >. Coded by
      <a
        href="https://www.frontendmentor.io/profile/DiogoLuxa"
        target="_blank"
        rel="noopener noreferrer"
        >Diogo Luxa</a
      >.
    </footer>
  </body>
</html>
